[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "node-rag"
version = "0.1.0"
description = "RAG platform for mixed-format documents (10K docs/day) on LangChain, LangGraph and Qdrant"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.4",
  "qdrant-client>=1.15",
  "sqlalchemy>=2.0.30",
  "psycopg[binary]>=3.2",
  "redis>=5.0",
  "alembic>=1.13",
  "prometheus-client>=0.20",
]

[project.optional-dependencies]
# Phase 2+: parsing, embedding and the ingestion graph.
ingest = [
  "langchain-core>=0.3",
  "langchain-text-splitters>=0.3",
  "langchain-openai>=0.3",
  "langchain-qdrant>=0.2",
  "langgraph>=0.4",
  "fastembed>=0.5",
  "docling>=2.30",
  "filetype>=1.2",
  "pypdf>=5.0",
  "pypdfium2>=4.30",
  "pandas>=2.2",
  "openpyxl>=3.1",
  "tabulate>=0.9",
  "extract-msg>=0.48",
  "python-pptx>=1.0",
  "celery[redis]>=5.4",
  "tenacity>=9.0",
]
# Phase 3+: query service.
api = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "langgraph-checkpoint-postgres>=2.0",
]
s3 = ["boto3>=1.34"]
azure = ["azure-storage-blob>=12.19"]
# NER-based PII detection (PII_ENGINE=presidio); also run: python -m spacy download en_core_web_sm
pii = ["presidio-analyzer>=2.2"]
dev = [
  "pytest>=8.0",
  "pyyaml>=6.0",
  "python-docx>=1.1",
  "reportlab>=4.0",
  "pillow>=10.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs the docker compose services running"]
