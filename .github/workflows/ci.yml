# Tests run in fake mode against real Qdrant/Postgres/Redis containers; no
# LLM credentials are needed or used.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      qdrant:
        image: qdrant/qdrant:v1.19.1
        ports: ["6333:6333", "6334:6334"]
      postgres:
        image: postgres:17-alpine
        env: {POSTGRES_USER: rag, POSTGRES_PASSWORD: rag, POSTGRES_DB: rag}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rag" --health-interval 5s --health-retries 20
      redis:
        image: redis:8.6-alpine
        ports: ["6379:6379"]
      azurite:
        image: mcr.microsoft.com/azure-storage/azurite:latest
        ports: ["10000:10000"]
    env:
      LLM_PROVIDER: fake
      HF_HUB_DISABLE_SYMLINKS_WARNING: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - name: "Install (CPU PyTorch first, much smaller)"
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[ingest,api,azure,dev]"
      - name: Cache models
        uses: actions/cache@v4
        with:
          path: .cache
          key: models-${{ hashFiles('pyproject.toml') }}
      - name: Wait for Qdrant
        run: for i in $(seq 1 30); do curl -sf http://127.0.0.1:6333/ && break; sleep 2; done
      - name: Migrations and collection
        run: python scripts/bootstrap.py
      - name: Tests
        run: python -m pytest -q -p no:warnings

  image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: node-rag:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Validate Kubernetes manifests
        run: |
          kubectl kustomize deploy/k8s > rendered.yaml
          docker run --rm -v "$PWD:/m" ghcr.io/yannh/kubeconform:latest -strict -summary \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            /m/rendered.yaml
