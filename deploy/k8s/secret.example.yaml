# TEMPLATE ONLY: not part of kustomization.yaml. Don't commit real values.
# Prefer Azure Key Vault + the Secrets Store CSI driver, or create it directly:
#   kubectl -n node-rag create secret generic rag-secrets --from-env-file=prod.env
apiVersion: v1
kind: Secret
metadata:
  name: rag-secrets
  namespace: node-rag
type: Opaque
stringData:
  AZURE_OPENAI_ENDPOINT: https://<resource>.openai.azure.com/
  AZURE_OPENAI_API_KEY: "<key>"
  AZURE_STORAGE_CONNECTION_STRING: "<storage connection string>"
  POSTGRES_DSN: postgresql+psycopg://<user>:<password>@<server>.postgres.database.azure.com:5432/rag?sslmode=require
  REDIS_URL: rediss://:<password>@<name>.redis.cache.windows.net:6380/0
  REDIS_ADDRESS: <name>.redis.cache.windows.net:6380        # for KEDA
  REDIS_PASSWORD: "<password>"
  QDRANT_URL: https://<cluster>.cloud.qdrant.io:6333
  QDRANT_API_KEY: "<qdrant key>"
